name: Release to Production

# Production deployment for the demo flow. GitHub for Atlassian sends this
# deployment (environment "production") to the Jira work items whose keys
# appear in the commits / branch names released since the last deployment.
on:
  workflow_dispatch:
    inputs:
      jira_key:
        description: "Jira epic or change key released (e.g. MOBL-123)"
        required: false
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build:
    name: Build release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build -- --base "/${{ github.event.repository.name }}/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy-prod:
    name: Deploying to Production
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Announce target (production)
        run: |
          echo "Environment : production"
          echo "Jira key    : ${{ github.event.inputs.jira_key }}"
          echo "Commit      : ${GITHUB_SHA::7}"

      - name: Deploy to GitHub Pages (production)
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        run: |
          {
            echo "## Deployed to Production"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Environment | \`production\` |"
            echo "| Jira key | ${{ github.event.inputs.jira_key }} |"
            echo "| URL | ${{ steps.deployment.outputs.page_url }} |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
